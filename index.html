<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Triathlon - MVVM & IndexedDB</title>
    <!-- STYLESHEET BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

    <!-- Load React. -->
    <!-- Note: when deploying, replace "development.js" with "production.min.js". -->
    <script crossorigin="anonymous" src="https://unpkg.com/react@18/umd/react.development.js">
    </script>
    <script crossorigin="anonymous" src="https://unpkg.com/react-dom@18/umd/react-dom.development.js">
    </script>

    <!-- Don't use this in production. It does a slow runtime code transformation -->
    <script crossorigin="anonymous" src="https://unpkg.com/@babel/standalone/babel.min.js">
    </script>
</head>

<body>
    <!-- the View -->
    <div class="m-5" id="app">
    </div>

    <!-- 
    Applying the module to your HTML file
    https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Modules#applying_the_module_to_your_html
    https://babeljs.io/docs/babel-plugin-transform-modules-umd
    --> 
    <script type="text/babel" data-plugins="transform-modules-umd" src="./Data/database.js"></script>
    <script type="text/babel" data-plugins="transform-modules-umd" src="./Data/timer_model.js"></script>
    <script type="text/babel" data-plugins="transform-modules-umd" src="./Data/athlete_model.js"></script>
    <script type="text/babel" data-plugins="transform-modules-umd" src="./Data/triathlon_model.js"></script>
    <script type="text/babel" data-plugins="transform-modules-umd" src="./Presentation/triathlon_view.js"></script>
    <script type="text/babel" data-plugins="transform-modules-umd" src="./Presentation/triathlon_viewmodel.js"></script>
    
    <script type="text/babel" data-plugins="transform-modules-umd" src="./index.js"></script>

</body>

</html>
