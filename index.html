<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triathlon App</title>
</head>

<body>
    <script type="module">
        import Storage from './src/storage.js';
        let storage = new Storage()

        //drill saving test data
        let drill = {
            time: "12:01",
            swimTime: 19.17,
            runTime: 321, 
            bikeTime: 2455
        }
        storage.saveDrillToStorage(drill)

        let training = {
            date: "March 13, 2024",
            location: "Evelyn Hugo Sports Centre"
        }
        storage.saveTrainingToStorage(training)

        // training loading test sample
        let index = 0
        let keys = ['date','location']
        for (let key of keys) {
            let result = storage.loadLocalStorage(key) 
            console.log(keys[index] + ": " + result)
            index ++
        }

        // drill loading test sample
        index = 0
        keys = ['time','swimTime','runTime', 'bikeTime']
        for (let key of keys) {
            let result = storage.loadLocalStorage(key) 
            console.log(keys[index] + ": " + result)
            index ++
        }

        // Loading both training and drills
        const allData = storage.loadAllLocalStorage() 
        console.log(allData)
    </script>

</body>
