<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Triathlon App</title>
</head>

<body>
    <script type="module">
        import { View }       from './src/view.js'
        import { Controller } from './src/controller.js'

        function main() {
            const triathlon = Controller.setup()
            View.clr()
            View.out(View.displayTriathlon(triathlon))
            View.out(View.displayAllAthletes(triathlon))
            View.out(View.displayAthleteStats(triathlon))
        }

        window.onload = main
    </script>
</body>

</html>
