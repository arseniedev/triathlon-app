<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" lang="en">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Triathlon App</title>
</head>
<body>
    <script src="./index.js" defer></script>

    <header>
        <h1>Triathlon App: setInterval() & setTimeout()</h1>
    </header>
    <aside>       
        <div id ="list_details">
            <h3>This page targets the features:</h3>
            <ul>
                <li>Feature# 14: Error Handling (try, catch, finally, throw)</li>
                <li>Feature# 15: setInterval, setTimeout, clearInterval, clearTimeout</li>
                <li>Feature# 16: Promise (resolve, reject, then, catch)</li>
            </ul>
        </div>

        <div id="TimeOut" class="tabcontent">
        </div>

    </aside>
    <main>
        <div id="time_display">
            <h2><div id="interval_output"></div></h2>
            <h5><div id="prompt"></div></h5>
        </div>
        <div id="time_button">
            <input type="button" class="tablinks" id="pause-play" onclick="timerPlayPause()" value="Play"></input>
        </div>
    </main>
    <nav class="tab">
        <button class="tablinks" onclick="saveData()">Save</button>
        <button class="tablinks" onclick="timeOut()">Stop & Reset</button>
    </nav>
    
    <footer>
        <table>
            <tr><div id="record_header"></div></tr>
            <tr><div id="list_output"></div></tr>
        </table>
    </footer>
</body>
</html>
